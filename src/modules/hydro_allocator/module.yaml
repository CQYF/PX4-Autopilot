module_name: hydro_allocator
parameters:
- group: HydroAllocator
  definitions:
    #水翼舵机和电机与Actuator配置页面中的舵机电机的对应关系
    #电机
    HY_RT${i}_IDX:
      description:
        short: The correspondence between hydro actuators and configuration actuators
      type: int32
      num_instances: 2
      default: 1
      min: 1
      max: 8
    #舵机
    HY_SV${i}_IDX:
      description:
        short: The correspondence between hydro actuators and configuration actuators
      type: int32
      num_instances: 2
      default: 1
      min: 1
      max: 8

    #水翼的虚拟执行器面对三轴力矩时需要执行的倍数
    #注意，虚拟执行器的输出单位是N，没有归一化，而三轴力矩是归一化的数值，因此这里的参数应当是较大的值
    #为什么只有力矩，没有力？ 因为水翼的thrust_setpoint也是没有归一化的值，不需要按倍数放大
    #z轴虚拟执行器
    HY_VZRT${i}_PIT_R:
      description:
        short: PIT ratio of Z-direction virtual motor
      type: float
      num_instances: 2
      default: 0.0
      decimal: 3
    HY_VZRT${i}_YAW_R:
      description:
        short: YAW ratio of Z-direction virtual motor
      type: float
      num_instances: 2
      default: 0.0
      decimal: 3
    HY_VZRT${i}_ROL_R:
      description:
        short: ROL ratio of Z-direction virtual motor
      type: float
      num_instances: 2
      default: 0.0
      decimal: 3
    #x轴虚拟执行器
    HY_VXRT${i}_PIT_R:
      description:
        short: PIT ratio of X-direction virtual motor
      type: float
      num_instances: 2
      default: 0.0
      decimal: 3
    HY_VXRT${i}_YAW_R:
      description:
        short: YAW ratio of X-direction virtual motor
      type: float
      num_instances: 2
      default: 0.0
      decimal: 3
    HY_VXRT${i}_ROL_R:
      description:
        short: ROL ratio of X-direction virtual motor
      type: float
      num_instances: 2
      default: 0.0
      decimal: 3

    #当没有可靠的速度源时，使用一个假设的定值滑行速度
    HY_ALT_SPEED:
      description:
        short: Alternative speed when there is no speed measurement
      type: float
      default: 1.0
      min: 0.0
      max: 15.0
      decimal: 2

    #滑行速度源选择
    HY_SPEED_SELECT:
      description:
        short: Speed selection
      type: enum
      values:
        0: Alternative speed
        1: Measurement speed (Unsupported)
      default: 0

    #单个水下推进器最大推力
    HY_RT_MAX_THRUST:
      description:
        short: Maximum thrust of a single underwater thruster
      type: float
      default: 30.0
      min: 0.0
      decimal: 1

    #单个翼面水下升力系数
    HY_WING_KL:
      description:
        short: Single wing surface underwater lift coefficient
      type: float
      default: 5.0
      min: 0.0
      decimal: 2

    #单个翼面最大攻角
    HY_WING_MAX_A:
      description:
        short: Maximum attack angle of a single wing surface
      type: float
      unit: rad
      default: 0.8
      min: 0.0
      decimal: 2

    #推进器推力上限增益系数，单个推进器推力上限不超过该值*throttle杆量，且不超过1
    HY_TH_MAX_GAIN:
      description:
        short: Upper limit gain coefficient of thrust
      type: float
      default: 2.0
      min: 1.0
      decimal: 2

    #折叠机翼做动时长
    HY_FDW_CT:
      description:
        short: foldwing fold time
      type: float
      default: 2.0
      min: 0.3
      decimal: 2

    #折叠机翼对应的输出通道
    HY_FDW_IDX:
      description:
        short: foldwing index, set 0 to disable output
      type: int32
      default: 0
      min: 0
      max: 8

    #折叠机翼对应的遥控器通道
    HY_FDW_AUX:
      description:
        short: foldwing aux channel
      type: enum
      values:
        0: Always 0
        1: Aux1
        2: Aux2
        3: Aux3
        4: Aux4
        5: Aux5
        6: Aux6
        7: Always -1
        8: Always 1
      default: 0

    #折叠机翼对应的遥控器阈值
    HY_FDW_UPTHR:
      description:
        short: foldwing up threshold
      type: float
      default: 0.5
      min: 0.0
      max: 1.0
      decimal: 2

    #折叠机翼对应的遥控器阈值
    HY_FDW_DNTHR:
      description:
        short: foldwing down threshold
      type: float
      default: -0.5
      min: -1.0
      max: 0.0
      decimal: 2

    #折叠机翼对应的遥控器通道的增益，可以用于反向
    HY_FDW_AUXGAIN:
      description:
        short: foldwing aux gain
      type: float
      default: 1.0
      decimal: 2

    #水翼启用禁用对应的遥控器通道
    HY_FOIL_AUX:
      description:
        short: hydrofoil aux channel
      type: enum
      values:
        0: Always 0
        1: Aux1
        2: Aux2
        3: Aux3
        4: Aux4
        5: Aux5
        6: Aux6
        7: Always -1
        8: Always 1
      default: 0

    #水翼启用禁用对应的遥控器阈值
    HY_FOIL_THR:
      description:
        short: hydrofoil threshold
      type: float
      default: 0.0
      min: -1.0
      max: 1.0
      decimal: 2

    #水翼启用禁用对应的遥控器通道的增益，可以用于反转通道功能
    HY_FOIL_AUXGAIN:
      description:
        short: hydrofoil aux gain
      type: float
      default: 1.0
      decimal: 2

    #控制分配的模式
    HY_ALLOCATE_MODE:
      description:
        short: allocate mode
      type: enum
      values:
        0: Normal Mode
        1: Fixed Mode
        2: Manual Mode
      default: 0

    HY_SV_L_FM:
      description:
        short: hydrofoil left servo angle in Fixed Mode
      type: float
      default: 0.0
      min: -1.0
      max: 1.0
      decimal: 2

    HY_SV_R_FM:
      description:
        short: hydrofoil right servo angle in Fixed Mode
      type: float
      default: 0.0
      min: -1.0
      max: 1.0
      decimal: 2

    HY_ALCT_MT_MAN:
      description:
        short: allocate motor ratio in manual mode
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      decimal: 2

    HY_ALCT_SV_MAN:
      description:
        short: allocate servo ratio in manual mode
      type: float
      default: 1.0
      min: -1.0
      max: 1.0
      decimal: 2

    HY_ALCT_YAW_MAN:
      description:
        short: allocate yaw ratio in manual mode
      type: float
      default: 1.0
      min: -1.0
      max: 1.0
      decimal: 2

    HY_ALCT_ROL_MAN:
      description:
        short: allocate roll ratio in manual mode
      type: float
      default: 1.0
      min: -1.0
      max: 1.0
      decimal: 2
