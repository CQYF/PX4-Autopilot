module_name: slide_estimator
parameters:
- group: SlideEstimator
  definitions:

    #模块运行间隔
    HY_SE_TS:
      description:
        short: Module running interval
      unit:us
      type: int32
      min: 1000
      default: 1000

    #根据水压计算深度的参数
    HY_SE_PR_P0:
      description:
        short: Air pressure at the surface of the water, in pascals
      type: float
      min: 10000
      default: 100000
    HY_SE_PR_RHO:
      description:
        short: Water density
      type: float
      unit: kg/m^3
      min: 0.1
      default: 1000
    HY_SE_G:
      description:
        short: Gravitational acceleration
      type: float
      unit: m/s^2
      min: 0.1
      default: 9.8

    #深度计数据与中值滤波结果之间的最大差值，超过的数据无效
    HY_SE_PR_MAXD:
      description:
        short: The maximum difference between the slide data from pressure gauge and the median filtering result
      type: float
      unit: m
      default: 0.5
      min: 0.01

    #水位计浸水深度饱和评估参数
    HY_SE_LV_SAT_UUP:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.1
    HY_SE_LV_SAT_UP:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.09
    HY_SE_LV_SAT_DN:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.01
    HY_SE_LV_SAT_DDN:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.0

    #是否根据水位计饱和情况调整位置更新增益
    HY_SE_LV_IS_SAT:
      description:
        short: Should the position update gain adjusted based on the saturation
      type: boolean
      default: 0

    #中心指向水位计顶部的位移矢量
    HY_SE_C_LV_X:
      description:
        short: Vector from the center to the top of the water level gauge
      type: float
      default: 0.0
    HY_SE_C_LV_Y:
      description:
        short: Vector from the center to the top of the water level gauge
      type: float
      default: 0.0
    HY_SE_C_LV_Z:
      description:
        short: Vector from the center to the top of the water level gauge
      type: float
      default: 0.0

    #中心指向压强计的位移矢量
    HY_SE_C_PR_X:
      description:
        short: Vector from the center to the top of the pressure gauge
      type: float
      default: 0.0
    HY_SE_C_PR_Y:
      description:
        short: Vector from the center to the top of the pressure gauge
      type: float
      default: 0.0
    HY_SE_C_PR_Z:
      description:
        short: Vector from the center to the top of the pressure gauge
      type: float
      default: 0.0

    #位置更新增益，实际增益等于该参数乘以时间间隔
    HY_SE_POS_K:
      description:
        short: Position update gain
        long: Position update gain, the actual gain is equal to the parameter multiplied by the time interval
      type: float
      min: 0.0
      default: 0.0
    #速度更新增益，实际增益等于该参数乘以时间间隔
    HY_SE_VEL_K:
      description:
        short: Velocity update gain
        long: Velocity update gain, the actual gain is equal to the parameter multiplied by the time interval
      type: float
      min: 0.0
      default: 0.0



