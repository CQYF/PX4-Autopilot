module_name: slide_estimator
parameters:
- group: SlideEstimator
  definitions:

    #根据水压计算深度的参数
    HY_SE_PR_P0:
      description:
        short: Air pressure at the surface of the water, in pascals
      type: float
      min: 10000
      default: 100000
    HY_SE_PR_RHO:
      description:
        short: Water density
      type: float
      unit: kg/m^3
      min: 0.1
      default: 1000
    HY_SE_G_PR:
      description:
        short: Gravitational acceleration for pr
      type: float
      unit: m/s^2
      min: 0.1
      default: 9.8

    #加速度计校准参数，用于减去重力加速度
    HY_SE_G_ACC:
      description:
        short: Gravitational acceleration for acc
      type: float
      unit: m/s^2
      min: 0.1
      default: 9.8

    #深度计数据与中值滤波结果之间的最大差值，超过的数据无效
    HY_SE_PR_MAXD:
      description:
        short: The maximum difference between the depth data from pressure gauge and the median filtering result
      type: float
      unit: m
      default: 0.5
      min: 0.01

    # 深度计测算出的自身深度的最大值，超过的数据无效
    HY_SE_PR_MAXX:
      description:
        short: The maximum of the depth data from pressure gauge
      type: float
      unit: m
      default: 0.3
      max: 0.5

    # 深度计测算出的自身深度的最小值，超过的数据无效
    HY_SE_PR_MINX:
      description:
        short: The minimum of the depth data from pressure gauge
      type: float
      unit: m
      default: 0
      min: 0

    #水位计浸水深度饱和评估参数
    HY_SE_LV_SAT_UUP:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.09
    HY_SE_LV_SAT_UP:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.08
    HY_SE_LV_SAT_DN:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.01
    HY_SE_LV_SAT_DDN:
      description:
        short: Assessment parameters for saturation of water immersion
      type: float
      default: 0.0

    #水位计长度
    HY_SE_LV_LEN:
      description:
        short: Length of the water level gauge
      type: float
      unit: m
      min: 0.0
      default: 0.1

    #中心指向水位计顶部的位移矢量
    HY_SE_C_LV_X:
      description:
        short: Vector from the center to the top of the water level gauge
      type: float
      default: 0.0
    HY_SE_C_LV_Y:
      description:
        short: Vector from the center to the top of the water level gauge
      type: float
      default: 0.0
    HY_SE_C_LV_Z:
      description:
        short: Vector from the center to the top of the water level gauge
      type: float
      default: 0.0

    #中心指向压强计的位移矢量
    HY_SE_C_PR_X:
      description:
        short: Vector from the center to the top of the pressure gauge
      type: float
      default: 0.0
    HY_SE_C_PR_Y:
      description:
        short: Vector from the center to the top of the pressure gauge
      type: float
      default: 0.0
    HY_SE_C_PR_Z:
      description:
        short: Vector from the center to the top of the pressure gauge
      type: float
      default: 0.0

    #历史记录的过期时间
    HY_SE_LIFESPAN:
      description:
        short: The lifespan of historical records
      type: int32
      unit: us
      min: 1000
      default: 100000

    #加速度传感器的测量噪声
    HY_SE_R_ACC:
      description:
        short: Measurement noise of acceleration sensor
      type: float
      min: 0.0
      default: 0.1

    #压强计的测量噪声
    HY_SE_R_PR:
      description:
        short: Measurement noise of pressure gauge
      type: float
      min: 0.0
      default: 3.0

    #水位计的测量噪声
    HY_SE_R_LV:
      description:
        short: easurement noise of water level gauge
      type: float
      min: 0.0
      default: 2.0

    #水位计饱和时的最大额外测量噪声
    HY_SE_R_LVSAT:
      description:
        short: Maximum additional measurement noise when the water level gauge is saturated
      type: float
      min: 0.0
      default: 20.0

    #高度部分的过程噪声
    HY_SE_Q_HGT:
      description:
        short: Process noise in the height
      type: float
      min: 0.0
      default: 1

    #压强计累积误差的过程噪声
    HY_SE_Q_ERR:
      description:
        short: Process noise of cumulative error of pressure gauge
      type: float
      min: 0.0
      default: 1


